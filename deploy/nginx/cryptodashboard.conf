# Copie para /etc/nginx/conf.d/cryptodashboard.conf na EC2.
# Nginx recebe o tráfego público e repassa para o app na porta 8080 (só local).

server {
    listen 80;
    server_name _;   # troque pelo seu domínio quando tiver um

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Blazor Server usa WebSocket: sem estes cabeçalhos, a página carrega mas os botões não respondem
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Depois de configurar o domínio com o Certbot (sudo certbot --nginx -d seu-dominio),
# o Certbot cria o bloco 443 e o redirecionamento de 80 para 443.
