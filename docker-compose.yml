services:
  app:
    build: .
    # Só o próprio servidor acessa a porta. O acesso público passa pelo Nginx (deploy/nginx/).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Confia em X-Forwarded-For e X-Forwarded-Proto enviados pelo Nginx
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - "ConnectionStrings__Default=Data Source=/data/crypto.db"
      - Sentiment__Provider=Ollama
      - Sentiment__Ollama__BaseUrl=http://ollama:11434
      - Sentiment__Ollama__Model=${OLLAMA_MODEL:-llama3.2}
      - Sentiment__Ollama__TimeoutMinutes=${OLLAMA_TIMEOUT_MINUTES:-10}
    volumes:
      - cryptodata:/data
    depends_on:
      - ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ollama:
    image: ollama/ollama
    # Sem "ports": o Ollama fica acessível só pela rede interna do Compose
    volumes:
      - ollamamodels:/root/.ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cryptodata:
  ollamamodels:
